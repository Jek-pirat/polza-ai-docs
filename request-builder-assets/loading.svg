<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <style>
    .spinner{transform-origin:14px 14px;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
  <circle cx="14" cy="14" r="11" stroke="#888" stroke-opacity=".2" stroke-width="2.5"/>
  <circle class="spinner" cx="14" cy="14" r="11" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="22 48"/>
</svg>
